name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils libreoffice-writer libreoffice-impress
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
